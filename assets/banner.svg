<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic / Animated Background Wave & Nodes (Positioned behind text) -->
  <g opacity="0.35">
    <!-- Animated Wave Path 1 -->
    <path d="M -100 280 C 200 180, 400 380, 700 240 C 950 120, 1100 300, 1300 200 L 1300 450 L -100 450 Z" fill="url(#primary-grad)" opacity="0.4">
      <animate attributeName="d" 
               dur="12s" 
               repeatCount="indefinite"
               values="M -100 280 C 200 180, 400 380, 700 240 C 950 120, 1100 300, 1300 200 L 1300 450 L -100 450 Z;
                       M -100 240 C 250 320, 450 160, 750 280 C 900 340, 1150 180, 1300 250 L 1300 450 L -100 450 Z;
                       M -100 280 C 200 180, 400 380, 700 240 C 950 120, 1100 300, 1300 200 L 1300 450 L -100 450 Z"/>
    </path>

    <!-- Animated Wave Path 2 -->
    <path d="M -100 180 C 300 300, 500 120, 800 280 C 1000 380, 1150 150, 1300 220 L 1300 450 L -100 450 Z" fill="url(#cyan-grad)" opacity="0.3">
      <animate attributeName="d" 
               dur="16s" 
               repeatCount="indefinite"
               values="M -100 180 C 300 300, 500 120, 800 280 C 1000 380, 1150 150, 1300 220 L 1300 450 L -100 450 Z;
                       M -100 220 C 200 150, 600 320, 750 180 C 950 240, 1100 320, 1300 180 L 1300 450 L -100 450 Z;
                       M -100 180 C 300 300, 500 120, 800 280 C 1000 380, 1150 150, 1300 220 L 1300 450 L -100 450 Z"/>
    </path>

    <!-- Floating Glowing Orbs -->
    <circle cx="150" cy="100" r="120" fill="#6366f1" filter="url(#soft-glow)" opacity="0.25">
      <animate attributeName="cy" values="100;130;100" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="300" r="140" fill="#ec4899" filter="url(#soft-glow)" opacity="0.2">
      <animate attributeName="cy" values="300;270;300" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="80" r="90" fill="#06b6d4" filter="url(#soft-glow)" opacity="0.25">
      <animate attributeName="cx" values="900;930;900" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content Container (Ensures Text remains crisp & visible on top) -->
  <g transform="translate(60, 0)">
    <!-- Lock / Shield Privacy Badge Icon -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="70" height="70" rx="20" fill="url(#shield-grad)" filter="url(#glow)"/>
      <!-- Shield Checkmark Icon -->
      <path d="M 35 18 C 35 18, 48 24, 52 26 C 52 40, 46 52, 35 58 C 24 52, 18 40, 18 26 C 22 24, 35 18, 35 18 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 28 37 L 33 42 L 43 31" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title -->
    <text x="95" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="-0.5">
      Awesome Consent &amp; Preference Management
    </text>

    <!-- Gradient Pill Sub-badge -->
    <g transform="translate(95, 175)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#primary-grad)"/>
      <text x="155" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        PRIVACY • CMP • GDPR • TCF • COOKIES
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="95" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#cbd5e1">
      Curated List of SaaS Platforms &amp; Open-Source Consent Management Systems
    </text>

    <!-- Feature Badges Flow -->
    <g transform="translate(95, 275)">
      <!-- Feature 1: Enterprise CMP -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="15" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🔒 Enterprise CMP</text>

      <!-- Feature 2: Open-Source -->
      <rect x="180" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="195" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399">⚡ Open Source</text>

      <!-- Feature 3: TCF & Consent Mode -->
      <rect x="350" y="0" width="225" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="365" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#f472b6">🌐 Google Consent Mode v2</text>
    </g>
  </g>
</svg>
